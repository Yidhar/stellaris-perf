; stellaris-perf settings. The plugin re-reads this file while the game runs, whenever it is saved.
; Defaults: everything that gives the game's own answer is on; the per-day caches and the experimental modifier path are off.
; Multiplayer: every player needs the plugin with the same settings.
[perf]
; -1 = leave the game's setting alone, 0 = off (faster ticks), 1 = on (smoother UI)
frame_smoothing=-1
; fleet parallel update: one fleet per work chunk, so a doomstack does not stall the other threads (same results)
fleet_parallel_grain1=1
; fleet manager window: cache fleet military power for up to 1 s (display only)
fleet_manager_cache=1
; fleet manager window: recalculate ships to reinforce at most every N ms (the game: 80 ms; display only)
fleet_manager_reinforce_ms=1000
; the rest of the in-game GUI (fleet window, outliner rows, map icons, tooltips): the same cache for the fleet power it asks for (display only)
ui_power_cache=1
; fleet window: the upgrade button's affordability check kept for up to 1 s; 0 = off, 1 = on, 2 = verify (display only)
fleet_upgrade_cache=1
; galaxy view: the cursor's and hover indicator's path check kept for up to 0.5 s; 0 = off, 1 = on, 2 = verify (display only)
cursor_path_cache=1
; tooltips: 0 = built every frame (the game), 1 = kept while no key or button is pressed and the mouse and the game day stay as they were,
; 2 = verify (built every frame, compared with the kept one); display only
tooltip_cache=1
; the longest a tooltip is kept, in ms of real time
tooltip_cache_ms=250
; has_*_flag scan: 0 = the game's, 1 = SSE2 (same answer), 2 = verify (count mismatches)
flag_simd=1
; 1 = skip the daily flag expiry pass on containers without timed flags (same results)
flag_expiry_skip=1
; large-block recycler: the engine's big temporary arrays (a fleet's targeting tables, rebuilt every combat tick) get
; back the block the same thread freed last, still warm in that core's cache; alloc_cache_mb = what each thread keeps
alloc_cache=1
alloc_cache_mb=8
; parallel ship update: use the combat participants table's own object instead of a deep copy per ship (same results)
combat_no_copy=1
; colony monthly pass: 1 = the forced modifier refreshes done once at the end of each colony's pass and the modifier
; manager's flush held during it (same results for everything that reads), 2 = also the colony's modifier node frozen
; during its own pass (event triggers fired inside the pass see it as it was when the pass began)
colony_monthly_batch=2
; monthly pop-job assignment once instead of twice: the engine's second UpdatePopJobs call (one more iteration over the
; first's result; its own daily recompute of a changed colony is a single pass) is skipped
pop_jobs_single_pass=1
; month start: a faction's support and approval (its scripted demands) recomputed once per faction at the end of a window
; instead of after every pop move inside it (same values; nothing in the window reads them): 1 = each pop-job pass,
; 2 = the whole monthly colony update (growth, migration, the pop-job passes); 0 = the engine's calls as they come
pop_faction_batch=2
; monthly pop-job pass: the two modifier refreshes the engine forces for every pop group a promotion creates (each
; rebuilding the colony's and the planet's node first, dirty again at every one of them) skipped: 2 = the nodes left to
; their next reader, as any node the engine invalidates (half are never read again before the next pass); 1 = rebuilt
; once each when the pass ends (same values, no gain); 0 = the engine's refreshes; 3 = measurement
pop_jobs_node_batch=2
; experimental, off (measurement only): the serial refresh of every colony's modifier node at the start of the monthly
; pop-job pass: 1 = the modifier manager's own parallel flush runs before the pass instead (measured: costs more than
; the loop), 2 = the refreshes skipped (not the engine's result: the pass works from the colonies' last rebuilt state)
pop_jobs_flush_first=0
; a country's modifier node is invalidated several times a day and each invalidation marks everything the country
; owns (planets, pops, fleets, ships, armies...) for a rebuild by the next modifier flush, while the country's own
; rebuilt content is identical nine times out of ten: 2 = the node is rebuilt at once and its children are invalidated
; only when its content changed (the same for the relay network node; a child whose own inputs changed without an
; invalidation of its own then waits for its next one instead of the country-wide cascade); 1 = main-thread
; invalidations only (the relay network update's task keeps the engine's cascade); 3 = count only; 0 = the engine's
modifier_cascade_gate=2
; experimental, off: daily AI update with the countries processed heaviest first (same results: the order is scheduling
; only); measured no gain, the phase is the heaviest country's own update, which starts first anyway
ai_parallel_lpt=0
; daily AI update: scripted weight factors (ai_weight and the like, evaluated many times for the same thing while a
; ship design or a planet's buildings are chosen) remembered per (weight, scope) within one phase (same results)
ai_weight_cache=1
; experimental, off: daily AI update with a parallel-for started inside a country's update run on that thread instead
; of forking tasks (same results); measured within noise, the inlined work replaces the wait one for one
ai_nested_inline=0
; save files: the numbers formatted by plain integer code instead of the C runtime's printf (same text; each format is
; checked against the runtime when the plugin loads)
save_fast_format=1
; save files: the text put into the memory file in place, the tokens, keys and indentation straight from the engine's
; token table and unescaped quoted strings in one piece, instead of a temporary and four calls per piece (same bytes)
save_fast_writer=1
; frames drawn in the middle of a tick (frame smoothing) at most this many per second; 0 = the game's own rate (display only)
tick_render_fps=10
; the same cap for the frames drawn between ticks, while the simulation is running (paused or in a menu: not capped)
render_cap_between_ticks=1
; approximations (not the game's exact behaviour), off: 1 = cache per game day
opinion_cache=0
; 0 = off, 1 = every rule, 2 = adaptive (only rules measured to gain), per game day
rule_cache=0
; experimental, off: modifier flush fast path (0/1; 2 = verify, 3 = control)
modifier_flush=0
modifier_flush_max=32
; diagnostics, written to logs\ of the plugin folder: profile (per-day call timing), rule_profile (stellaris_perf_rules.csv),
; scope_profile (event-target resolution)
profile=0
rule_profile=0
scope_profile=0
; node_trace: the modifier graph's work by source per 30 game days (invalidations by call site and cascade root, rebuilds
; by category and context, the manager's flush), written to logs\stellaris_perf.log as node_trace: lines
node_trace=0
; phase_profile: per-game-day timing of the engine's phases (tick parts, AI wait, autosave, rendering, GUI update) by
; kind of day, written to logs\stellaris_perf_phases.json; bench\scripts\phase_report.py prints the table
phase_profile=0
; extra functions timed by phase_profile, "0xRVA[=name], ..." (RVAs of this exe build; only function starts are accepted)
phase_extra=
; record the call sites of one timed function ("0xRVA", one of phase_extra's or a fixed phase's entry point)
phase_callers=
